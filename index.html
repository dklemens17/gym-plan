<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<title>Gym Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E7EEEA;
  --card: #FFFFFF;
  --ink: #11233A;
  --muted: #586977;
  --line: #C8D4CE;
  --field: #F3F7F5;
  --cone: #E8621A;
  --cone-soft: #FCE4D4;
  --turf: #23704A;
  --turf-soft: #DBEEE2;
  --band: #11233A;
  --band-ink: #F2F5F8;
  --band-muted: #9FB2C4;
  --fig: #11233A;
  --fig-far: #9DAEBB;
  --equip: #7F909C;
  --stage: #F3F7F5;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C141C;
    --card: #15202B;
    --ink: #E6EDF3;
    --muted: #93A4B3;
    --line: #2A3947;
    --field: #0F1923;
    --cone: #FF7A30;
    --cone-soft: #3A2315;
    --turf: #55B884;
    --turf-soft: #15301F;
    --band: #08111A;
    --fig: #E6EDF3;
    --fig-far: #566A7D;
    --equip: #6E8091;
    --stage: #0F1923;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cone); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* Header band */
.band { background: var(--band); color: var(--band-ink); padding: calc(12px + env(safe-area-inset-top)) 0 12px; }
.hd-row { display: flex; align-items: center; gap: 4px; }
.nav {
  width: 40px; height: 56px; border: 0; background: transparent; color: var(--band-muted);
  border-radius: 8px; display: grid; place-items: center;
}
.nav:disabled { opacity: .3; cursor: default; }
.nav svg { width: 22px; height: 22px; }
.wk { display: flex; align-items: baseline; gap: 6px; min-width: 112px; justify-content: center; }
.wk-label { font: 600 20px/1 "Barlow Condensed", sans-serif; color: var(--band-muted); }
.wk-num { font: 700 76px/0.9 "Barlow Condensed", sans-serif; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.ph { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 2px; }
.ph strong { font: 600 22px/1.1 "Barlow Condensed", sans-serif; }
.ph span { color: var(--band-muted); font-size: 14px; }
.badge {
  align-self: flex-end; margin-top: 4px; background: var(--cone); color: #fff;
  font: 600 14px/1 "Barlow Condensed", sans-serif; padding: 4px 8px; border-radius: 6px;
}
/* 36-week strip: 3 stages x 3 blocks x 4 weeks */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stage-col { display: flex; flex-direction: column; gap: 5px; }
.stage-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.blk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.seg { border: 0; padding: 6px 0 4px; background: transparent; display: flex; flex-direction: column; gap: 2px; position: relative; }
.seg .h { display: block; height: 6px; border-radius: 1.5px; background: #2B3F55; }
.seg .h.on { background: var(--cone); }
.seg.test .h:first-child { box-shadow: inset 0 2px 0 #5C7187; }
.seg.cur::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px; background: var(--band-ink); border-radius: 1px; }
.stage-name { font: 500 12px/1.1 Barlow, sans-serif; color: var(--band-muted); }
.stage-col.cur .stage-name { color: var(--band-ink); font-weight: 600; }

/* Tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; }
.tab {
  flex: 1; border: 0; background: transparent; padding: 12px 4px 10px; border-bottom: 3px solid transparent;
  font: 600 18px/1.1 "Barlow Condensed", sans-serif; color: var(--muted);
}
.tab small { display: block; font: 400 12px/1.2 Barlow, sans-serif; margin-top: 2px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cone); }

/* Sections */
main { padding-top: 16px; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.sec h2 { margin: 0 0 4px; font: 600 22px/1.15 "Barlow Condensed", sans-serif; }
.sec p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 2px 6px; }
.sum h1 { margin: 0; font: 600 24px/1.1 "Barlow Condensed", sans-serif; }
.sum .count { font: 600 18px/1 "Barlow Condensed", sans-serif; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sum .count b { color: var(--cone); }
.weekhint { margin: 0 2px 10px; font-size: 15px; color: var(--muted); }
.weekhint b { color: var(--ink); font-weight: 600; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 2px 12px; }
.meter i { display: block; height: 100%; background: var(--cone); }
.run-cta { margin-bottom: 16px; }
.run-cta .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; font-size: 24px; }
.run-cta .btn svg { width: 22px; height: 22px; }
.fine { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* Section headings inside a day */
.grp { margin: 22px 2px 10px; }
.grp h2 { margin: 0; font: 700 26px/1.05 "Barlow Condensed", sans-serif; }
.grp p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.grp.knee h2 { color: var(--turf); }

/* Warm-up */
.checks { list-style: none; margin: 6px 0 0; padding: 0; }
.checks li + li { border-top: 1px solid var(--line); }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; }
.checks input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--cone); flex: none; }
.checks .done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.bal { margin: 0 0 10px 34px; display: flex; flex-direction: column; gap: 4px; }
.bal label { padding: 0; font-size: 13px; color: var(--muted); }
.bal select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); font-size: 15px; }

/* Exercise cards */
.pair { border-left: 3px solid var(--cone); padding-left: 10px; margin: 0 0 12px; }
.pair-note { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.pair .ex { margin-bottom: 8px; }
.pair .ex:last-child { margin-bottom: 0; }
.ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 10px; margin-bottom: 12px; }
.ex-hd { display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: start; }
.ex-num { font: 700 30px/0.95 "Barlow Condensed", sans-serif; color: var(--cone); }
.ex.all-done .ex-num { color: var(--turf); }
.ex-name { margin: 0; font: 600 20px/1.15 "Barlow Condensed", sans-serif; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--line); color: var(--muted); }
.chip.spec { color: var(--ink); font-weight: 600; }
.chip.new { background: var(--cone-soft); color: var(--cone); border-color: transparent; font-weight: 600; }
.guard { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--turf-soft); color: var(--turf); font-size: 14px; }
.guard b { font-weight: 600; }
.variant { display: inline-flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.variant button { border: 0; background: var(--field); padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.variant button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.tip { margin: 8px 0 0 50px; font-size: 14px; color: var(--muted); }
.tip summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.tip p { margin: 6px 0 0; }
.tip .fig { margin-top: 8px; max-width: 320px; }
.last { margin: 6px 0 0 50px; font-size: 13px; color: var(--muted); }
.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 48px; gap: 6px; align-items: center; }
.set.one { grid-template-columns: 30px 1fr 48px; }
.set-n { font: 600 17px/1 "Barlow Condensed", sans-serif; color: var(--muted); text-align: center; }
.fld { position: relative; display: block; }
.fld input {
  width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--field);
  padding: 0 44px 0 12px; font: 600 20px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.fld input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.fld span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.fld-text { height: 46px; display: flex; align-items: center; padding: 0 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 15px; }
.tick {
  width: 48px; height: 46px; border-radius: 8px; border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center; color: var(--line); padding: 0;
}
.tick svg { width: 22px; height: 22px; }
.set.is-done .tick { background: var(--cone); border-color: var(--cone); color: #fff; }
.set.is-done input { background: var(--cone-soft); border-color: transparent; }

/* Figure */
.fig { display: block; width: 100%; height: auto; background: var(--stage); border-radius: 8px; }

/* Tests */
.tests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tests label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.tests .fld input { padding-right: 34px; }
.tests .prev { font-size: 12px; color: var(--muted); min-height: 16px; }

textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 10px 12px; resize: vertical; }

.btn {
  display: block; width: 100%; height: 52px; border: 0; border-radius: var(--radius); background: var(--cone); color: #fff;
  font: 600 20px/1 "Barlow Condensed", sans-serif;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.done { background: var(--turf); }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.danger { color: var(--cone); }

/* Progress */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { text-align: left; padding: 8px 5px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
td.num, th.num { text-align: right; }
.up { color: var(--turf); font-weight: 600; }
.big { font: 700 44px/1 "Barlow Condensed", sans-serif; }
.big small { font: 500 18px/1 Barlow, sans-serif; color: var(--muted); margin-left: 6px; }
.gains { list-style: none; padding: 0; margin: 10px 0 0; font-size: 15px; }
.gains li { padding: 4px 0; }

/* Rest timer bar (log view) */
.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--band); color: var(--band-ink);
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
}
.timer .wrap { display: flex; align-items: center; gap: 10px; }
.timer .lbl { font-size: 14px; color: var(--band-muted); }
.timer .clock { font: 700 38px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; min-width: 86px; }
.timer.go .clock { color: var(--cone); }
.timer button { margin-left: auto; height: 42px; padding: 0 12px; border-radius: 8px; border: 1px solid #34495F; background: transparent; color: var(--band-ink); font-weight: 600; white-space: nowrap; }
.timer .lbl { line-height: 1.2; max-width: 34%; }
.timer button + button { margin-left: 0; }

/* Run workout overlay */
.run { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.run[hidden] { display: none; }
.run-top { background: var(--band); color: var(--band-ink); padding: calc(8px + env(safe-area-inset-top)) 0 10px; flex: none; }
.run-top .wrap { display: flex; align-items: center; gap: 10px; }
.run-top .wrap.barwrap { display: block; }
.run-close { border: 1px solid #34495F; background: transparent; color: var(--band-ink); height: 38px; padding: 0 12px; border-radius: 8px; font-weight: 600; }
.run-where { font: 600 18px/1.1 "Barlow Condensed", sans-serif; }
.run-where span { display: block; font: 400 13px/1.2 Barlow, sans-serif; color: var(--band-muted); }
.run-step { margin-left: auto; font: 600 18px/1 "Barlow Condensed", sans-serif; color: var(--band-muted); font-variant-numeric: tabular-nums; }
.run-bar { height: 4px; background: #2B3F55; margin-top: 10px; border-radius: 2px; overflow: hidden; }
.run-bar i { display: block; height: 100%; background: var(--cone); }
.run-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 0 20px; }
.run-foot { flex: none; border-top: 1px solid var(--line); background: var(--card); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
.run-foot .wrap { display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
.run-foot .btn { height: 56px; font-size: 22px; }
.run-grp { font: 600 16px/1.2 "Barlow Condensed", sans-serif; color: var(--muted); margin: 0 0 4px; }
.run-grp.knee { color: var(--turf); }
.run-ex { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.run-ex .ex-num { font-size: 40px; }
.run-ex h2 { margin: 0; font: 600 28px/1.05 "Barlow Condensed", sans-serif; }
.run-setof { font: 600 20px/1.2 "Barlow Condensed", sans-serif; color: var(--muted); margin: 4px 0 10px; }
.run-setof b { color: var(--cone); }
.run .fig { margin: 0 auto 10px; max-width: 420px; max-height: 38vh; }
.run .guard { margin: 0 0 10px; }
.rest-view .fig { max-height: 26vh; }
.run-tip { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
.run-last { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.steppers.single { grid-template-columns: 1fr; }
.stepper { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.stepper .lab { font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; display: block; }
.stepper .ctl { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
.stepper button { height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); font: 600 26px/1 "Barlow Condensed", sans-serif; padding: 0; }
.stepper input { width: 100%; height: 48px; border: 0; background: transparent; text-align: center; font: 700 32px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; padding: 0; }
.stepper input::placeholder { color: var(--muted); opacity: .5; }
.run-skip { display: block; margin: 12px auto 0; border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 8px; }
.rest-view { text-align: center; padding-top: 8px; }
.rest-view .lbl { font: 600 22px/1 "Barlow Condensed", sans-serif; color: var(--muted); }
.rest-view .clock { font: 700 120px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.rest-view.go .clock { color: var(--cone); }
.rest-view .next { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
.rest-view .next b { color: var(--ink); }
.rest-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 360px; margin: 14px auto 0; }
.run-done h2 { font: 700 40px/1 "Barlow Condensed", sans-serif; margin: 6px 0 6px; }

.checks li { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 10px; }
.checks li > label { flex: 1; min-width: 0; }
.checks .bal { flex-basis: 100%; }
.mini-timer { margin-top: 6px; height: 34px; min-width: 64px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); font: 600 17px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); }
.mini-timer.on { background: var(--cone); border-color: var(--cone); color: #fff; }
.run-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.run-clock { font: 600 20px/1 "Barlow Condensed", sans-serif; color: var(--band-muted); font-variant-numeric: tabular-nums; }
.snd { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #34495F; background: transparent; color: var(--band-ink); display: grid; place-items: center; padding: 0; }
.snd svg { width: 20px; height: 20px; }
.snd[aria-pressed="false"] { color: var(--band-muted); }
.rest-bar { height: 8px; max-width: 360px; margin: 6px auto 12px; background: var(--line); border-radius: 4px; overflow: hidden; }
.rest-bar i { display: block; height: 100%; background: var(--cone); transition: width .25s linear; }
.rest-why { max-width: 460px; margin: 0 auto 12px; font-size: 15px; color: var(--ink); text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.hold-view { text-align: center; margin: 4px 0 10px; padding: 10px 0; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.hold-view .lbl { font: 600 24px/1 "Barlow Condensed", sans-serif; color: var(--muted); }
.hold-view .clock { font: 700 110px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
.hold-view[data-phase="work"] .clock, .hold-view[data-phase="work"] .lbl { color: var(--turf); }
.hold-view[data-phase="switch"] .clock, .hold-view[data-phase="switch"] .lbl { color: var(--cone); }
.hold-btn { background: var(--turf); margin: 0 0 10px; height: 56px; font-size: 22px; }
.btn.stop { background: var(--ink); color: var(--card); }
@media (prefers-reduced-motion: reduce) { .rest-bar i { transition: none; } }
/* PRs and PR Challenges */
.ex.challenge { border: 2px solid var(--cone); box-shadow: 0 0 0 4px var(--cone-soft); }
.ex.challenge.flash { animation: cardflash .9s ease-in-out 2; }
@keyframes cardflash { 50% { box-shadow: 0 0 0 10px var(--cone-soft); } }
.chal-ribbon { display: flex; align-items: center; gap: 8px; margin: -12px -12px 10px; padding: 8px 12px; border-radius: 8px 8px 0 0; background: var(--cone); color: #fff; font: 600 18px/1.1 "Barlow Condensed", sans-serif; }
.chal-ribbon svg { width: 20px; height: 20px; flex: none; color: #F5C518; }
.chal-rule { margin: 8px 0 0 50px; font-size: 14px; color: var(--ink); }
.chal-rule b { color: var(--cone); }
.set.chal-set .set-n { color: var(--cone); }
.set.chal-set .set-n svg { width: 20px; height: 20px; }
.set.chal-set input { border-color: var(--cone); border-width: 2px; }
.set-n.pr { font: 700 13px/1 Barlow, sans-serif; color: #11233A; background: #F5C518; border-radius: 6px; padding: 5px 0; }
.last.rec, .run-last.rec { color: var(--turf); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.last.rec svg, .run-last.rec svg { width: 16px; height: 16px; flex: none; color: #C99A00; }
.chal-callout { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; margin: 0 0 14px; padding: 12px; border-radius: var(--radius); border: 2px solid var(--cone); background: var(--cone-soft); color: var(--ink); font-size: 15px; animation: glow 1.8s ease-in-out infinite; }
.chal-callout svg { width: 28px; height: 28px; color: var(--cone); flex: none; }
.chal-callout b { display: block; font: 700 21px/1.1 "Barlow Condensed", sans-serif; color: var(--cone); margin-bottom: 2px; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 var(--cone-soft); } 50% { box-shadow: 0 0 0 7px var(--cone-soft); } }
.chal-banner { margin: 0 0 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--cone); color: #fff; font-size: 15px; animation: glow 1.4s ease-in-out infinite; }
.chal-banner b { display: flex; align-items: center; gap: 8px; font: 700 30px/1 "Barlow Condensed", sans-serif; margin-bottom: 6px; }
.chal-banner b svg { width: 28px; height: 28px; color: #F5C518; }
.chal-strip { display: flex; gap: 6px; align-items: center; justify-content: center; margin: 0 0 10px; color: var(--cone); font-weight: 600; font-size: 15px; }
.run-body .chal-strip { justify-content: flex-start; }
.rest-view .chal-strip { justify-content: center; }
.chal-strip svg { width: 18px; height: 18px; }

.splash { position: relative; overflow: hidden; display: grid; place-items: center; min-height: calc(100vh - 210px); text-align: center; border-radius: 16px; background: var(--band); color: var(--band-ink); padding: 28px 18px; }
.splash-rays { position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg, rgba(232, 98, 26, .22) 0 10deg, transparent 10deg 20deg); animation: spin 16s linear infinite; }
.splash-in { position: relative; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.splash-trophy svg { width: 80px; height: 80px; color: #F5C518; filter: drop-shadow(0 0 14px rgba(245, 197, 24, .65)); }
.splash-kicker { margin: 4px 0 0; font: 600 20px/1 "Barlow Condensed", sans-serif; color: var(--band-muted); }
.splash-title { margin: 6px 0 10px; font: 700 68px/0.95 "Barlow Condensed", sans-serif; color: #fff; text-shadow: 0 0 18px rgba(232, 98, 26, .9), 0 2px 0 #B8480E; animation: flashy 1s ease-in-out 3; }
.splash-ex { margin: 0 0 12px; font: 600 26px/1.1 "Barlow Condensed", sans-serif; }
.splash-beat { display: inline-block; margin: 0 0 14px; padding: 8px 16px; border-radius: 999px; background: #F5C518; color: #11233A; font-weight: 700; font-size: 17px; }
.splash-rule, .splash-when { max-width: 420px; margin: 0 auto 8px; font-size: 15px; color: var(--band-muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flashy { 50% { opacity: .3; } }
.pr-pop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(8, 17, 26, .6); }
.pr-pop[hidden] { display: none; }
.pr-card { width: min(360px, 100%); background: var(--card); border: 3px solid #F5C518; border-radius: 16px; padding: 22px 18px 16px; text-align: center; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.pr-card.chal { border-color: var(--cone); }
.pr-card.soft { border-color: var(--line); }
.pr-trophy svg { width: 68px; height: 68px; color: #F5C518; }
.pr-title { margin: 6px 0 4px; font: 700 36px/1 "Barlow Condensed", sans-serif; color: var(--cone); }
.pr-card.soft .pr-title { color: var(--ink); }
.pr-name { margin: 0; font-weight: 600; }
.pr-value { margin: 8px 0; font: 700 46px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
.pr-gain { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }
#confetti[hidden] { display: none; }
.pr-board h3 { margin: 14px 0 4px; font: 600 18px/1.1 "Barlow Condensed", sans-serif; }
.pr-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.pr-stats div { background: var(--field); border-radius: 8px; padding: 10px; }
.pr-stats small { display: block; color: var(--muted); font-size: 13px; }
.prlist { list-style: none; margin: 4px 0 0; padding: 0; }
.prlist li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.prlist li svg { width: 20px; height: 20px; flex: none; color: #C99A00; margin-top: 2px; }
.prlist li span { display: block; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) {
  .splash-rays, .splash-in, .splash-title, .pr-card, .chal-callout, .chal-banner, .ex.challenge.flash { animation: none; }
}
.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

<script>
(() => {
'use strict';

/* =====================================================================
   Figure engine: a stick figure posed by joint angles, animated between
   keyframes. Angles are in degrees: 0 points up, 90 points forward
   (right), 180 points down. Every limb angle is absolute, not relative.
   ===================================================================== */
const LEN = { torso: 44, neck: 6, head: 10, ua: 26, fa: 24, th: 38, sh: 36, ft: 12 };
const GY = 156;
const RAD = Math.PI / 180;
const dir = a => [Math.sin(a * RAD), -Math.cos(a * RAD)];
const add = (p, a, l) => { const d = dir(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
const angTo = (p, q) => Math.atan2(q[0] - p[0], -(q[1] - p[1])) / RAD;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

// Two-link inverse kinematics: angles that put the end of the chain on q.
function ik(p, q, l1, l2, bend) {
  const base = angTo(p, q);
  let d = Math.hypot(q[0] - p[0], q[1] - p[1]);
  if (d >= l1 + l2 - 0.01) return [base, base];
  d = Math.max(d, Math.abs(l1 - l2) + 0.01);
  const a = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)) / RAD;
  const u = base + (bend || 1) * a;
  return [u, angTo(add(p, u, l1), q)];
}

// Turn an authored pose into a uniform, interpolatable one.
function norm(p) {
  const t = p.t || 0;
  const ln0 = p.ln || [180, 180];
  const lf0 = p.lf || ln0;
  let hip;
  if (p.v === 'foot') hip = add(add([p.x, p.y], ln0[1] + 180, LEN.sh), ln0[0] + 180, LEN.th);
  else if (p.v === 'footF') hip = add(add([p.x, p.y], lf0[1] + 180, LEN.sh), lf0[0] + 180, LEN.th);
  else hip = [p.x, p.y];
  const ln = p.lnT ? ik(hip, p.lnT, LEN.th, LEN.sh, p.lnB) : ln0;
  const lf = p.lfT ? ik(hip, p.lfT, LEN.th, LEN.sh, p.lfB) : lf0;
  const neck = add(hip, t, LEN.torso);
  const knee = add(hip, ln[0], LEN.th);
  const tgt = v => (typeof v === 'function' ? v(neck, t, knee) : v);
  const an = p.anT ? ik(neck, tgt(p.anT), LEN.ua, LEN.fa, p.anB) : (p.an || [180, 180]);
  const af = p.afT ? ik(neck, tgt(p.afT), LEN.ua, LEN.fa, p.afB) : (p.af || an);
  const ftn = p.ftn == null ? 90 : p.ftn;
  return { hx: hip[0], hy: hip[1], t, hd: p.hd || 0, ln, lf, an, af, ftn, ftf: p.ftf == null ? ftn : p.ftf, bf: p.bf || 0 };
}
const lerp = (a, b, u) => a + (b - a) * u;
const lerpA = (a, b, u) => a + ((((b - a) % 360) + 540) % 360 - 180) * u;
const lerp2 = (a, b, u) => [lerpA(a[0], b[0], u), lerpA(a[1], b[1], u)];
function mixPose(A, B, u) {
  return {
    hx: lerp(A.hx, B.hx, u), hy: lerp(A.hy, B.hy, u), t: lerpA(A.t, B.t, u), hd: lerpA(A.hd, B.hd, u),
    ln: lerp2(A.ln, B.ln, u), lf: lerp2(A.lf, B.lf, u), an: lerp2(A.an, B.an, u), af: lerp2(A.af, B.af, u),
    ftn: lerpA(A.ftn, B.ftn, u), ftf: lerpA(A.ftf, B.ftf, u), bf: lerp(A.bf, B.bf, u)
  };
}
function joints(n) {
  const hip = [n.hx, n.hy];
  const neck = add(hip, n.t, LEN.torso);
  const head = add(neck, n.t + n.hd, LEN.neck + LEN.head);
  const kn = add(hip, n.ln[0], LEN.th), ankN = add(kn, n.ln[1], LEN.sh), toeN = add(ankN, n.ftn, LEN.ft);
  const kf = add(hip, n.lf[0], LEN.th), ankF = add(kf, n.lf[1], LEN.sh), toeF = add(ankF, n.ftf, LEN.ft);
  const en = add(neck, n.an[0], LEN.ua), hn = add(en, n.an[1], LEN.fa);
  const ef = add(neck, n.af[0], LEN.ua), hf = add(ef, n.af[1], LEN.fa);
  return { hip, neck, head, kn, ankN, toeN, kf, ankF, toeF, en, hn, ef, hf, t: n.t };
}

const f1 = v => v.toFixed(1);
const pts = arr => arr.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const chain = (arr, w, c) => `<polyline points="${pts(arr)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const EQ = 'var(--equip)', LOAD = 'var(--cone)';
const P = {
  ground: `<line x1="6" y1="${GY + 3}" x2="234" y2="${GY + 3}" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`,
  db: (p, r = 6) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="var(--cone-soft)" stroke="${LOAD}" stroke-width="2.5"/>`,
  plate: (p, r) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${LOAD}" fill-opacity=".16" stroke="${LOAD}" stroke-width="3"/><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.5" fill="${LOAD}"/>`,
  barEnd: p => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="7" fill="none" stroke="${LOAD}" stroke-width="3"/><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="3" fill="${LOAD}"/>`,
  ball: p => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="8" fill="${LOAD}"/><path d="M${f1(p[0] - 8)} ${f1(p[1])}h16M${f1(p[0])} ${f1(p[1] - 8)}v16" stroke="var(--cone-soft)" stroke-width="1.5"/>`,
  bench: (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="6" rx="2" fill="${EQ}"/><path d="M${x + 8} ${y + 6}V${GY}M${x + w - 8} ${y + 6}V${GY}" stroke="${EQ}" stroke-width="3"/>`,
  box: (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="${GY + 2 - y}" rx="2" fill="${EQ}" fill-opacity=".45"/>`,
  wall: x => `<rect x="${x}" y="-20" width="10" height="${GY + 24}" fill="${EQ}" fill-opacity=".35"/>`,
  post: (x, y) => `<path d="M${x} ${y}V${GY}" stroke="${EQ}" stroke-width="4" stroke-linecap="round"/>`,
  cone: x => `<path d="M${x - 6} ${GY + 2}L${x} ${GY - 14}L${x + 6} ${GY + 2}Z" fill="${LOAD}"/>`,
  towel: p => `<rect x="${f1(p[0] - 9)}" y="${GY - 2}" width="20" height="5" rx="2" fill="${EQ}"/>`
};

function drawPose(f, n, alpha) {
  const j = joints(n);
  const far = 'var(--fig-far)', ink = 'var(--fig)';
  let s = '';
  if (f.back) s += f.back(j, n);
  s += `<g transform="translate(3 0)">${chain([j.neck, j.ef, j.hf], 6, far)}${chain([j.hip, j.kf, j.ankF, j.toeF], 7, far)}${f.farFront ? f.farFront(j, n) : ''}</g>`;
  s += chain([j.hip, j.neck], 9, ink);
  s += `<circle cx="${f1(j.head[0])}" cy="${f1(j.head[1])}" r="${LEN.head}" fill="${ink}"/>`;
  s += chain([j.hip, j.kn, j.ankN, j.toeN], 7, ink);
  s += chain([j.neck, j.en, j.hn], 6, ink);
  if (f.front) s += f.front(j, n);
  if (f.ball) {
    const h = mid(j.hn, j.hf);
    s += P.ball([lerp(h[0], f.ball[0], n.bf), lerp(h[1], f.ball[1], n.bf)]);
  }
  return alpha == null ? s : `<g opacity="${alpha}">${s}</g>`;
}

const S = o => Object.assign({ v: 'foot', x: 110, y: GY, t: 0, ln: [180, 180], lf: [180, 180], an: [180, 180], af: [180, 180], ftn: 90, ftf: 90 }, o);
const DIP = { t: 40, ln: [140, 205], lf: [140, 205] };
const ARMS_BACK = { an: [225, 225], af: [228, 228] };
const ARMS_FWD = { an: [95, 100], af: [98, 103] };
const AIR = { t: 2, ln: [182, 182], lf: [182, 182], an: [12, 12], af: [16, 16], ftn: 155, ftf: 155 };
const QUICK = { t: 22, ln: [160, 195], lf: [160, 195], an: [205, 200], af: [208, 203] };
const backBar = (neck, t) => add(add(neck, t - 90, 8), t + 180, 3);
const HK = { v: 'foot', x: 76, y: 152, ln: [180, 270], lfT: [156, 154], lfB: -1, ftn: 180 };

const FIG = {

      { p: S(QUICK), ms: 220 },

      { p: S({ x: 158, ...DIP, ...ARMS_FWD }), ms: 320, hold: 1000 },

  slrdl: {

function poseAt(f, time) {
  let tm = time % f.total;
  const fr = f.frames, N = fr.length;
  for (let i = 0; i < N; i++) {
    const ms = fr[i].ms || 1, hold = fr[i].hold || 0;
    const prev = fr[(i - 1 + N) % N].n;
    if (tm < ms) return mixPose(prev, fr[i].n, ease(tm / ms));
    tm -= ms;
    if (tm < hold) return fr[i].n;
    tm -= hold;
  }
  return fr[0].n;
}

    const rows = s && s.sets[sid];

// One PR Challenge per session, rotating through the block:
// Day A: Copenhagen hold, hex bar weight, single-leg lift weight, hex bar rep max (test week).
// Day B: push, squat weight, push, squat rep max (test week).
const CHALLENGE_SLOT = { A: ['5b', '3', '4a', '3'], B: ['7a', '6', '7a', '6'] };

  const sid = info(ex, w, d).sid;

    ch.mode = 'repmax'; ch.cap = 12; ch.title = 'Rep max challenge';
    ch.rule = `Last set: same weight as your other sets, as many clean reps as you can. Stop at ${ch.cap}, or as soon as form slips.`;
    ch.beat = rec && rec.e != null ? `Beat your best set: ${fmtN(rec.ew)} lb x ${rec.er}` : 'Set your first record';
  } else if (kind === 'load') {

      : `Last set: your heaviest clean set of ${target}.`;

}
function dayChallenge(w, d) {

const slotOfEx = (ex, w, d) => DAYS[d].slots.find(s => exAt(s, w) === ex);

/* ---------- Celebrations ---------- */
const PR_TITLE = { weight: 'New weight PR', strength: 'New strength PR', reps: 'New rep PR', hold: 'Longest hold yet', test: 'New test PR', first: 'First record set' };
let prTimer = null;
function celebrate(ev, name, challenge) {

  $pr.innerHTML = `<div class="pr-card${challenge ? ' chal' : ''}" role="alertdialog" aria-label="${esc(title)}">
    <div class="pr-trophy">${ICON_TROPHY}</div>
    <p class="pr-title">${esc(title)}</p>
    <p class="pr-name">${esc(name)}</p>

    ${ev.gain ? `<p class="pr-gain">${esc(ev.gain)}</p>` : ''}
    <button class="btn" data-act="pr-close">Nice!</button></div>`;
  $pr.hidden = false;

  prTimer = setTimeout(closePR, challenge ? 6000 : 4500);
}
function softCard(title, name, msg) {
  const $pr = document.getElementById('pr');
  $pr.innerHTML = `<div class="pr-card soft" role="status"><p class="pr-title">${esc(title)}</p><p class="pr-name">${esc(name)}</p>
    <p class="pr-gain">${esc(msg)}</p><button class="btn" data-act="pr-close">OK</button></div>`;
  $pr.hidden = false;

function closePR() { clearTimeout(prTimer); const $pr = document.getElementById('pr'); $pr.hidden = true; $pr.innerHTML = ''; }
// After a set is logged: celebrate a PR, a won challenge, or a first record.
function checkPR(w, d, ex, i, slot) {
  const inf = info(ex, w, d);
  const ch = isChallengeSet(slot || slotOfEx(ex, w, d), w, d, i);
  const P = computePRs();
  const ev = P.at[`${w}${d}:${inf.sid}:${i}`];
  if (ev) { celebrate(ev, inf.name, !!ch); return true; }
  if (!ch) return false;
  const row = rowsFor(w, d, ex, false)[i];
  const m = row && metricOf(ch.kind, row);
  if (!ch.rec && m) {
    celebrate({ type: 'first', text: ch.kind === 'load' ? `${fmtN(m.w)} lb x ${m.r}` : `${m.r}${ch.kind === 'hold' ? ' sec' : ' reps'}`, gain: 'Now there is a record to beat next time.' }, inf.name, true);
    return true;
  }
  if (P.events.some(e => e.w === w && e.d === d && e.sid === inf.sid)) {
    softCard('PR already won today', inf.name, 'You beat the record on an earlier set. The challenge counts.');
    return true;

  softCard('Challenge done', inf.name, `The record stays at ${recordText(ch.kind, ch.rec)}. Good effort. Another shot comes later in the block.`);

}
function tone(freq, at, dur) {
  try {
    const t0 = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* audio not available */ }
}
function fanfare() {

  [[523, 0, 0.14], [659, 0.12, 0.14], [784, 0.24, 0.14], [1047, 0.36, 0.4]].forEach(([f, t, dur]) => tone(f, t, dur));

function confetti(n) {
  const c = document.getElementById('confetti');
  if (REDUCED || !c || !c.getContext) return;
  const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr; c.hidden = false;
  const css = getComputedStyle(document.documentElement);
  const cols = ['--cone', '--turf', '--cone-soft'].map(v => css.getPropertyValue(v).trim()).concat(['#F5C518', '#4F8FE0']);
  const ps = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.4, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4,
    s: Math.random() * 6 + 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - el / 2400);

const $hd = document.getElementById('hd');

function render() {

function renderTabs() {
  const t = (id, label, sub) => `<button class="tab" role="tab" data-act="view" data-v="${id}" aria-selected="${state.view === id}">${label}<small>${sub}</small></button>`;
  const status = d => { const s = session(state.week, d, false); const c = counts(state.week, d); return s && s.done ? 'Done' : `${c.done} of ${c.total} sets`; };

// Group a day's slots into sections and a/b pairs.
function layout(d) {
  const slots = DAYS[d].slots;
  const out = [];
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (/a$/.test(s.num) && slots[i + 1] && /b$/.test(slots[i + 1].num)) { out.push([s, slots[i + 1]]); i++; }
    else out.push([s]);
  }
  return out;
}

function renderDay(d) {
  const w = state.week;
  PRS = computePRs();
  const day = DAYS[d];
  const s = session(w, d, false);
  const c = counts(w, d);
  const pct = c.total ? Math.round(c.done / c.total * 100) : 0;
  let html = `
    <div class="sum"><h1>${day.title}: ${esc(day.sub)}</h1><span class="count" id="count"><b>${c.done}</b> / ${c.total}</span></div>
    <p class="weekhint"><b>Week ${wib(w) + 1} of the block.</b> ${WEEK_HINT[wib(w)](w)}</p>
    <div class="meter" aria-hidden="true"><i id="meter" style="width:${pct}%"></i></div>
    <div class="run-cta"><button class="btn" data-act="run">${ICON_PLAY}${s && s.done ? 'Run it again' : c.done > 0 ? 'Resume workout' : 'Run workout'}</button></div>
    ${challengeCallout(w, d, true)}`;

  if (isTest(w)) html += testPanel(w);
  html += warmPanel(w, d, s);

  let sec = null;
  for (const g of layout(d)) {
    if (g[0].sec !== sec) {
      sec = g[0].sec;
      const S_ = SECTIONS[sec];
      html += `<div class="grp${S_.knee ? ' knee' : ''}"><h2>${S_.title}</h2><p>${S_.note}</p></div>`;
    }
    if (g.length === 2) {
      const pr = pairRest(exAt(g[0], w), exAt(g[1], w), w);
      html += `<div class="pair"><p class="pair-note">Alternate ${g[0].num} and ${g[1].num}, then rest ${restLabel(pr)}.</p>${exCard(g[0], w, d, `Then ${g[1].num}`)}${exCard(g[1], w, d, `Rest ${restLabel(pr)}`)}</div>`;
    } else html += exCard(g[0], w, d, `Rest ${restLabel(baseRest(exAt(g[0], w), w))}`);
  }

  html += `
    <section class="sec" style="margin-top:20px">
      <h2>Notes</h2>
      <textarea id="notes" data-act="notes" placeholder="How did it feel? Anything to change next time?" aria-label="Session notes"></textarea>
    </section>
    <button class="btn${s && s.done ? ' done' : ''}" data-act="finish">${s && s.done ? 'Session finished (tap to reopen)' : 'Finish session'}</button>
    <p class="fine" style="text-align:center">Everything saves on this phone as you go.</p>`;

}

function renderProgress() {

      </div>
      ${recs.length ? `<h3>Records</h3><table><tbody>${recs.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${esc(r.t)}</td></tr>`).join('')}</tbody></table>` : '<p>Records appear after an exercise is logged twice: the first time sets the baseline.</p>'}
      ${recent.length ? `<h3>Recent PRs</h3><ul class="prlist">${recent.map(e => `<li>${ICON_TROPHY}<div><b>${esc(evName(e))}: ${esc(e.text)}</b><span>Week ${e.w}${e.d ? `, Day ${e.d}` : ''}${e.chal ? ', PR Challenge' : ''}. ${esc(e.gain)}</span></div></li>`).join('')}</ul>` : ''}
    </section>`;
  const doneSessions = Object.values(state.sessions).filter(s => s.done).length;
  const tw = TEST_WEEKS.filter(w => { const t = state.tests[w]; return t && TESTS.some(x => num(t[x.id]) != null); });
  const testRows = tw.map(w => `<tr><td>Week ${w}</td>${TESTS.map(x => { const v = num((state.tests[w] || {})[x.id]); return `<td class="num">${v == null ? '' : v}</td>`; }).join('')}</tr>`).join('');
  const gains = TESTS.map(x => {
    const vals = tw.map(w => num(state.tests[w][x.id])).filter(v => v != null);
    if (vals.length < 2) return '';
    const diff = +(vals[vals.length - 1] - vals[0]).toFixed(2);
    const better = x.better === 'up' ? diff > 0 : diff < 0;
    return `<li>${x.label}: <span class="${better ? 'up' : ''}">${diff > 0 ? '+' : ''}${diff} ${x.unit}</span> since the first test</li>`;
  }).join('');

  const liftRows = [];
  for (let w = 1; w <= WEEKS; w++) {
    const cells = LIFTS.map(L => {
      const s = state.sessions[key(w, L.day)];
      const rows = s && s.sets[L.sid] ? s.sets[L.sid] : [];
      const best = rows.filter(r => r.d).map(r => num(r.w)).filter(v => v != null);
      return best.length ? Math.max(...best) : null;
    });
    if (cells.some(v => v != null)) liftRows.push(`<tr><td>Wk ${w}</td>${cells.map(v => `<td class="num">${v == null ? '' : v}</td>`).join('')}</tr>`);
  }

  $main.innerHTML = prBoard + `
    <section class="sec">
      <h2>Sessions finished</h2>
      <div class="big">${doneSessions}<small>of ${WEEKS * 2}</small></div>
      <p class="fine">${STAGES.map((s, i) => `Stage ${i + 1}, ${s.name} (weeks ${s.from} to ${s.to}): ${s.about.toLowerCase()}.`).join(' ')}</p>
    </section>
    <section class="sec">
      <h2>Test results</h2>
      <p>Logged in the last week of every block.</p>
      ${tw.length
        ? `<table><thead><tr><th>Week</th>${TESTS.map(x => `<th class="num">${x.label} (${x.unit})</th>`).join('')}</tr></thead><tbody>${testRows}</tbody></table>${gains ? `<ul class="gains">${gains}</ul>` : ''}`
        : '<p>Test scores show up here after week 4.</p>'}
    </section>
    <section class="sec">
      <h2>Main lifts</h2>
      <p>Heaviest completed set each week, in lb.</p>
      ${liftRows.length
        ? `<table><thead><tr><th>Week</th>${LIFTS.map(L => `<th class="num">${L.label}</th>`).join('')}</tr></thead><tbody>${liftRows.join('')}</tbody></table>`
        : '<p>Check off a weighted set and it shows up here.</p>'}
    </section>
    <section class="sec">
      <h2>Backup</h2>
      <p>The log lives in this phone's browser. Export a backup now and then, or to move it to another device.</p>
      <div class="row-btns">
        <button class="btn ghost" data-act="export">Export backup</button>
        <button class="btn ghost" data-act="import">Import backup</button>
      </div>
      <button class="btn ghost danger" data-act="reset" style="margin-top:8px">Erase all logs</button>
    </section>`;
}

function refreshCounts() {
  const d = state.view;
  if (d === 'P') return;
  const c = counts(state.week, d);
  const el = document.getElementById('count');
  if (el) el.innerHTML = `<b>${c.done}</b> / ${c.total}`;
  const m = document.getElementById('meter');
  if (m) m.style.width = (c.total ? Math.round(c.done / c.total * 100) : 0) + '%';
  renderTabs();
}
function refreshCard(slotNum) {
  const card = document.getElementById('ex-' + slotNum);
  if (!card) return;
  const slot = DAYS[state.view].slots.find(s => s.num === slotNum);
  const ex = exAt(slot, state.week);
  const n = setsOf(ex, state.week);
  const rows = rowsFor(state.week, state.view, ex, false);
  let done = 0;
  for (let i = 0; i < n; i++) if (rows[i] && rows[i].d) done++;
  card.classList.toggle('all-done', done === n);

/* =====================================================================
   Rest model. Base rest comes from the kind of work and the stage,
   following youth guidelines (about 1 min for beginners, 1 to 2 min
   for intermediate, 2 to 3 min for advanced and heavy or power work).
   Then each step adjusts it: paired sets, setup time between
   exercises, and extra rest when reps fall short.
   ===================================================================== */
const KIND = {
  cmj: 'plyo', sqjump: 'plyo', broad: 'plyo', depthdrop: 'plyo', latbound: 'plyo', hop: 'plyo',
  contvert: 'reactive', tbroad: 'reactive', depthjump: 'reactive', latboundc: 'reactive', hopc: 'reactive',
  hex: 'heavy', squat: 'heavy',
  lunge: 'strength', rfess: 'strength', stepup: 'strength', invrow: 'strength', dbrow: 'strength',
  dbbench: 'strength', pushup: 'strength', hkpress: 'strength',
  nordic: 'nordic',
  copen: 'knee', calf: 'knee', soleus: 'knee', sideabd: 'knee', spabd: 'knee', slbridge: 'knee',
  slsit: 'knee', stepdown: 'knee', isosplit: 'knee', slrdl: 'knee', hambridge: 'knee', slidecurl: 'knee',
  sprint: 'sprint', sprintk: 'sprint', shuttle: 'shuttle',
  wallthrow: 'throw', stepthrow: 'throw', medthrow: 'throw', hkthrow: 'throw',
  pullover: 'accessory', yraise: 'accessory', hollow: 'core', deadbug: 'core'
};
// Seconds per stage [Foundation, Strength, Power].
const REST = {
  heavy: { s: [75, 105, 150], tag: 'Heavy lift',
    why: "Heavy sets drain the muscle's quick energy store (phosphocreatine), which takes a couple of minutes to refill. Youth guidelines start near 1 minute and build to 2 to 3 minutes as loads get heavier." },
  strength: { s: [60, 90, 120], tag: 'Strength',
    why: 'Youth strength guidelines: about 1 minute while learning, up to 2 minutes as loads rise.' },
  plyo: { s: [45, 60, 75], tag: 'Jumps',
    why: 'In young soccer players, 30, 60 and 120 seconds between jump sets gave the same gains. Rest just long enough that every landing is crisp.' },
  reactive: { s: [60, 75, 90], tag: 'Reactive jumps',
    why: 'Linked and depth jumps are the most intense jumps, so they get a little more rest than stick jumps.' },
  sprint: { s: [90, 90, 105], tag: 'Sprint',
    why: 'Speed only improves when every sprint is near max. Research on young athletes points to more than 90 seconds between short sprints.' },
  shuttle: { s: [120, 120, 120], tag: 'Shuttle',
    why: 'A shuttle takes about 5 seconds. Resting roughly 25 times the effort keeps every run fast.' },
  throw: { s: [45, 45, 60], tag: 'Throws',
    why: 'Throws are short, explosive efforts. A short rest keeps the arm fast without cooling down.' },
  nordic: { s: [60, 75, 90], tag: 'Nordic',
    why: 'Nordics are near-maximal lowering efforts, so they get more rest than other knee armor work.' },
  knee: { s: [45, 60, 60], tag: 'Knee armor',
    why: 'Controlled strength work at moderate effort. About a minute keeps the muscles working without losing form.' },
  accessory: { s: [45, 45, 60], tag: 'Accessory',
    why: 'Lighter work that recovers quickly.' },
  core: { s: [30, 40, 45], tag: 'Core',
    why: 'Holds and core work recover quickly. Short rests keep the session moving.' }
};
const KID_NOTE = 'Kids recover from hard efforts faster than adults, so these rests are shorter than an adult plan would use.';
const restKind = ex => REST[KIND[ex.id]] || REST.strength;
const baseRest = (ex, w) => restKind(ex).s[stageOf(w)];
const pairRest = (a, b, w) => Math.max(30, Math.max(baseRest(a, w), baseRest(b, w)) - 15);
const fmtClock = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
};

/* =====================================================================
   Run workout: one step at a time
   ===================================================================== */
const $run = document.getElementById('run');
let run = null; // { w, d, idx, rest, hold }

function buildSteps(w, d) {
  const steps = [{ kind: 'warm' }];
  layout(d).forEach((g, gi) => {
    const exs = g.map(slot => ({ slot, ex: exAt(slot, w) }));
    const maxSets = Math.max(...exs.map(o => setsOf(o.ex, w)));
    for (let i = 0; i < maxSets; i++) {
      for (const o of exs) {
        if (i >= setsOf(o.ex, w)) continue;
        const partner = g.length > 1 ? exs.find(x => x.slot !== o.slot).ex : null;
        steps.push({ kind: 'set', slot: o.slot, ex: o.ex, i, of: setsOf(o.ex, w), pair: g.length > 1, group: gi, partner });
      }
    }
  });
  steps.push({ kind: 'finish' });
  return steps;
}

// Rest after a step, with the reason shown on the rest screen.
function restAfter(steps, idx, w, d) {
  const st = steps[idx], nx = steps[idx + 1];
  if (!st || st.kind !== 'set' || !nx || nx.kind !== 'set') return null;
  if (st.pair && nx.group === st.group && nx.i === st.i && nx.slot !== st.slot) {
    return { sec: 15, tag: 'Switch', why: `Go straight to ${nx.slot.num}. Working that exercise gives these muscles their rest.` };
  }
  let sec, why;
  const k = restKind(st.ex);
  if (st.pair) {
    sec = pairRest(st.ex, st.partner, w);
    const heavier = baseRest(st.partner, w) > baseRest(st.ex, w) ? restKind(st.partner) : k;
    why = heavier.why + ' Paired sets: the time spent on the other exercise already counts as rest.';
  } else {
    sec = baseRest(st.ex, w);
    why = k.why;
  }
  const row = rowsFor(w, d, st.ex, false)[st.i];
  if (row && row.d && st.ex.type !== 'check' && num(row.r) != null && num(row.r) < repsOf(st.ex, w)) {
    sec += 30; why += ' Reps came up short, so 30 seconds extra.';
  }
  if (nx.group !== st.group) { sec += 30; why += ' Plus 30 seconds to set up the next exercise.'; }
  return { sec: Math.min(sec, 210), tag: st.pair ? 'Paired sets' : k.tag, why };
}
function restForSet(w, d, slotNum, i) {
  const steps = buildSteps(w, d);
  const idx = steps.findIndex(s => s.kind === 'set' && s.slot.num === slotNum && s.i === i);
  return idx === -1 ? null : restAfter(steps, idx, w, d);
}

function firstOpenStep(w, d) {
  const steps = buildSteps(w, d);
  const anyDone = steps.some(st => st.kind === 'set' && (rowsFor(w, d, st.ex, false)[st.i] || {}).d);
  if (!anyDone) return 0;
  const i = steps.findIndex(st => st.kind === 'set' && !(rowsFor(w, d, st.ex, false)[st.i] || {}).d);
  return i === -1 ? steps.length - 1 : i;
}
function openRun() {
  stopTimer();
  audioOn();
  const w = state.week, d = state.view;
  const s = session(w, d, true);
  if (!s.done && (!s.startedAt || Date.now() - s.startedAt > 4 * 3600e3)) s.startedAt = Date.now();
  save();
  run = { w, d, idx: firstOpenStep(w, d), rest: null, hold: null, splashed: {}, fanfared: {} };
  $run.hidden = false;
  document.body.classList.add('locked');
  keepAwake(true);
  renderRun();
}
function closeRun() {
  run = null;
  $run.hidden = true;
  $run.innerHTML = '';
  document.body.classList.remove('locked');
  keepAwake(false);
  render();
}
function stepLabel(st, w, d) {
  if (!st) return '';
  if (st.kind === 'set') return `${st.slot.num} ${info(st.ex, w, d).name}, set ${st.i + 1}`;
  return st.kind === 'finish' ? 'Finish' : 'Warm-up';
}
function stepper(label, field, value, placeholder, step) {
  return `<div class="stepper"><span class="lab">${label}</span><div class="ctl">
    <button data-act="step" data-f="${field}" data-by="${-step}" aria-label="${label} down ${step}">&minus;</button>
    <input inputmode="decimal" data-run="${field}" value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${label}">
    <button data-act="step" data-f="${field}" data-by="${step}" aria-label="${label} up ${step}">+</button></div></div>`;
}
const perSide = (ex, w) => /per (side|leg|arm)/.test(sideOf(ex, w));

function challengeCallout(w, d, asButton) {
  const dc = dayChallenge(w, d);
  if (!dc) return '';
  const name = info(dc.ex, w, d).name;
  const inner = `${ICON_TROPHY}<span><b>Today's PR Challenge</b>${esc(dc.slot.num)} ${esc(name)}, set ${dc.ch.set + 1}. ${esc(dc.ch.beat)}.</span>`;
  return asButton
    ? `<button class="chal-callout" data-act="goto-ch" data-slot="${dc.slot.num}">${inner}</button>`
    : `<div class="chal-callout">${inner}</div>`;
}

function renderRun() {
  if (!run) return;
  const { w, d } = run;
  const steps = buildSteps(w, d);
  run.idx = Math.min(run.idx, steps.length - 1);
  const st = steps[run.idx];
  const total = steps.length;
  const s = session(w, d, false);
  let body = '', primary = '', primaryAct = 'run-next', primaryClass = '';
  const ch = st && st.kind === 'set' && !run.rest ? challengeOf(st.slot, w, d) : null;

  if (run.rest) {
    const R = run.rest;
    const nx = steps[run.idx];
    const nxInf = nx && nx.kind === 'set' ? info(nx.ex, w, d) : null;
    const nxCh = nx && nx.kind === 'set' ? challengeOf(nx.slot, w, d) : null;
    const left = Math.max(0, R.end - Date.now());
    body = `<div class="rest-view" id="restView">
      <div class="lbl">${R.tag === 'Switch' ? 'Switch' : esc(R.tag) + ' rest'}</div>
      <div class="clock" id="restClock">${fmtSec(Math.ceil(left / 1000))}</div>
      <div class="rest-bar" aria-hidden="true"><i id="restBar" style="width:${Math.round(100 * (1 - left / R.total))}%"></i></div>
      <p class="rest-why">${esc(R.why)}</p>
      <div class="rest-btns"><button class="btn ghost" data-act="rest-sub">&minus;15 sec</button><button class="btn ghost" data-act="rest-add">+15 sec</button></div>
      ${nxCh && nxCh.set === nx.i ? `<p class="chal-strip">${ICON_TROPHY}Next up is the PR Challenge set</p>` : ''}
      <p class="next">Next: <b>${esc(stepLabel(nx, w, d))}</b></p>
      ${nxInf ? figTag(nxInf.fig, nxInf.name) : ''}
      ${R.tag === 'Switch' ? '' : `<p class="fine">${KID_NOTE}</p>`}</div>`;
    primary = R.tag === 'Switch' ? 'Start now' : 'Skip rest';
    primaryAct = 'rest-skip';
  } else if (st.kind === 'warm') {
    body = challengeCallout(w, d, false)
      + `<p class="weekhint"><b>Week ${wib(w) + 1} of the block.</b> ${WEEK_HINT[wib(w)](w)}</p>`
      + (isTest(w) ? testPanel(w) : '') + warmPanel(w, d, s);
    primary = 'Start training';
  } else if (st.kind === 'set' && ch && !run.splashed[st.slot.num]) {
    // The flash callout as the athlete moves into the challenge exercise.
    const inf = info(st.ex, w, d);
    body = `<div class="splash" role="alert">
      <div class="splash-rays" aria-hidden="true"></div>
      <div class="splash-in">
        <div class="splash-trophy">${ICON_TROPHY}</div>
        <p class="splash-kicker">${esc(ch.title)}</p>
        <h2 class="splash-title">PR Challenge</h2>
        <p class="splash-ex">${st.slot.num} ${esc(inf.name)}</p>
        <p class="splash-beat">${esc(ch.beat)}</p>
        <p class="splash-rule">${esc(ch.rule)}</p>
        <p class="splash-when">${ch.set === st.i ? 'The challenge is this set.' : `The challenge is set ${ch.set + 1} of ${st.of}. The sets before it build up to it.`}</p>
      </div></div>`;
    primary = 'Let\'s go';
    primaryAct = 'splash-go';
    if (!run.fanfared[st.slot.num]) { run.fanfared[st.slot.num] = true; setTimeout(() => { fanfare(); buzz(); }, 120); }
  } else if (st.kind === 'set') {
    const ex = st.ex, inf = info(ex, w, d);
    const rows = rowsFor(w, d, ex, false);
    const r = rows[st.i] || { w: '', r: '', d: false };
    const target = repsOf(ex, w);
    const side = sideOf(ex, w);
    const ll = lastLine(ex, w, d);
    const sec = SECTIONS[st.slot.sec];
    const isCh = ch && ch.set === st.i;
    const kind = PR_KIND[ex.id];
    const rec = kind ? recordText(kind, computePRs().best[inf.sid]) : '';
    const unitWord = ex.type === 'check' ? (ex.id === 'shuttle' ? 'Run' : 'Sprint') : 'Set';
    const spec = isCh && ch.mode !== 'weight'
      ? (ch.mode === 'hold' ? `as long as you can, up to ${ch.cap} sec` : `max reps, up to ${ch.cap}`)
      : ex.type === 'check' ? `${target}` : `${target}${ex.type === 'time' ? ' sec' : ' reps'}${side ? ' ' + side : ''}`;
    const head = `
      <p class="run-grp${sec.knee ? ' knee' : ''}">${sec.title}</p>
      <div class="run-ex"><span class="ex-num">${st.slot.num}</span><h2>${esc(inf.name)}</h2></div>
      <p class="run-setof">${unitWord} <b>${st.i + 1}</b> of ${st.of}: ${esc(spec)}${st.pair ? ', alternating' : ''}</p>
      ${isCh ? `<div class="chal-banner"><b>${ICON_TROPHY}PR set!</b>${esc(ch.beat)}. ${esc(ch.rule)}</div>`
        : ch ? `<p class="chal-strip">${ICON_TROPHY}PR Challenge on set ${ch.set + 1}</p>` : ''}`;
    if (run.hold) {
      body = `${head}
        <div class="hold-view" id="holdView" data-phase="${run.hold.phase}">
          <div class="lbl" id="holdLbl">${holdLabel(run.hold)}</div>
          <div class="clock" id="holdClock">${holdClockText(run.hold)}</div>
        </div>
        ${figTag(inf.fig, inf.name)}`;
      primary = holdStopLabel(run.hold);

      primaryClass = ' stop';
    } else {
      const repLabel = isCh && ch.mode !== 'weight' ? 'Reps done' : 'Reps';

      } else if (ex.type === 'reps' || ex.type === 'time') {
        inputs = `<div class="steppers single">${stepper(ex.type === 'time' ? 'Seconds held' : repLabel, 'r', r.r || String(target), String(target), ex.type === 'time' ? 5 : 1)}</div>`;
      }
      let holdBtn = '';
      if (ex.type === 'time') {
        holdBtn = isCh && ch.mode === 'hold'
          ? `<button class="btn hold-btn chal" data-act="hold-start">Start max hold${perSide(ex, w) ? ', each side' : ''}</button>`
          : `<button class="btn hold-btn" data-act="hold-start">Start ${target} sec timer${perSide(ex, w) ? ', each side' : ''}</button>`;
      }
      body = `${head}
        ${variantControl(ex, w, d)}

        ${guardHtml(ex)}

        ${rec ? `<p class="run-last rec">${ICON_TROPHY}Record: ${esc(rec)}</p>` : ''}
        ${ll ? `<p class="run-last">${esc(ll)}</p>` : ''}
        ${holdBtn}
        ${inputs}
        ${r.d ? '<p class="fine">Already logged. Change the numbers and log it again, or move on.</p>' : ''}
        <button class="run-skip" data-act="run-skip">Skip this set</button>`;
      const verb = isCh ? 'Log PR attempt' : ex.type === 'check' ? `${unitWord} done` : 'Log set';
      const rr = restAfter(steps, run.idx, w, d);
      primary = isCh || !rr ? verb : rr.tag === 'Switch' ? `${verb}, then ${steps[run.idx + 1].slot.num}` : `${verb}, rest ${restLabel(rr.sec)}`;
      primaryAct = 'run-log';
      if (isCh) primaryClass = ' chal';
    }
  } else {
    const c = counts(w, d);
    const mins = s && s.startedAt ? Math.round(((s.done && s.doneAt ? Date.parse(s.doneAt) : Date.now()) - s.startedAt) / 60000) : null;
    const todays = computePRs().events.filter(e => e.w === w && e.d === d);
    body = `<div class="run-done"><h2>${c.done} of ${c.total} sets logged</h2>
      ${mins != null ? `<p class="run-tip">Session time: ${mins} min.</p>` : ''}
      ${todays.length ? `<div class="chal-callout">${ICON_TROPHY}<span><b>${todays.length} PR${todays.length > 1 ? 's' : ''} today</b>${todays.map(e => esc(sidName(e.sid, w) + ' ' + e.text)).join(', ')}</span></div>` : ''}
      <p class="run-tip">Add a note for next time, then finish the session.</p>

    primary = s && s.done ? 'Close' : 'Finish session';

  const pct = Math.round(run.idx / (total - 1) * 100);
  const soundOn = state.sound !== false;
  $run.innerHTML = `
    <div class="run-top"><div class="wrap">
      <button class="run-close" data-act="run-close">Close</button>
      <div class="run-where">Week ${w}, ${DAYS[d].title}<span>Step ${run.idx + 1} of ${total}</span></div>
      <div class="run-meta">

        <button class="snd" data-act="sound" aria-pressed="${soundOn}" aria-label="Timer sounds ${soundOn ? 'on' : 'off'}">${soundOn ? ICON_SOUND : ICON_MUTE}</button>
      </div>
    </div><div class="wrap barwrap"><div class="run-bar"><i style="width:${pct}%"></i></div></div></div>

    <div class="run-foot"><div class="wrap">

    </div></div>`;
  const notes = document.getElementById('runNotes');
  if (notes) notes.value = s ? s.notes || '' : '';
  const body$ = $run.querySelector('.run-body');
  if (body$) body$.scrollTop = 0;
  tickSession();
  kickAnim();
}

function runField(f) { const el = $run.querySelector(`[data-run="${f}"]`); return el ? el.value.trim() : ''; }

function logRunSet(repsOverride) {
  const { w, d } = run;
  const steps = buildSteps(w, d);
  const st = steps[run.idx];
  if (!st || st.kind !== 'set') return;
  const rows = rowsFor(w, d, st.ex, true);
  const r = rows[st.i];
  if (st.ex.type === 'load') r.w = runField('w');
  if (st.ex.type !== 'check') r.r = repsOverride != null ? String(repsOverride) : runField('r');
  completeSet(st.ex, w, d, st.i);
  save();
  checkPR(w, d, st.ex, st.i, st.slot);
  const rest = restAfter(steps, run.idx, w, d);
  run.hold = null;
  run.idx = Math.min(run.idx + 1, steps.length - 1);
  if (rest && rest.sec > 0) startRest(rest); else renderRun();
}

/* ---------- Rest countdown (run view) ---------- */
function startRest(r) {
  run.rest = { end: Date.now() + r.sec * 1000, total: r.sec * 1000, tag: r.tag, why: r.why, beeped: {} };
  renderRun();
}
function tickRest() {
  if (!run || !run.rest) return;
  const R = run.rest;
  const leftMs = R.end - Date.now();
  const left = Math.max(0, leftMs / 1000);
  const c = document.getElementById('restClock');
  if (c) c.textContent = left > 0 ? fmtSec(Math.ceil(left)) : 'Go';
  const b = document.getElementById('restBar');
  if (b) b.style.width = Math.max(0, Math.min(100, 100 * (1 - leftMs / R.total))) + '%';
  const sLeft = Math.ceil(left);
  if (sLeft > 0 && sLeft <= 3 && !R.beeped[sLeft]) { R.beeped[sLeft] = 1; beep(660, 90); }
  if (left <= 0 && !R.goAt) {
    R.goAt = Date.now();
    beep(990, 220, 2); buzz();
    const v = document.getElementById('restView');
    if (v) v.classList.add('go');
  }
  if (R.goAt && Date.now() - R.goAt > 1500) endRest();
}
function endRest() { if (run) { run.rest = null; renderRun(); } }

/* ---------- Hold timer (timed exercises) ---------- */
// Counts down to the target, or in a hold challenge counts up until the
// athlete stops or hits the cap. Per-side holds switch sides in between.
function holdLabel(H) {
  if (H.phase === 'ready') return 'Get set';
  if (H.phase === 'switch') return 'Switch sides';
  const side = H.sides === 2 ? (H.side === 1 ? ', first side' : ', second side') : '';
  return (H.max ? 'Hold as long as you can' : 'Hold') + side;
}
function holdClockText(H) {
  const now = Date.now();
  if (H.phase === 'work' && H.max) return fmtSec(Math.floor((now - H.start) / 1000));
  return fmtSec(Math.ceil(Math.max(0, H.end - now) / 1000));
}
function holdStopLabel(H) {
  if (H.max && H.phase === 'work') return H.sides === 2 && H.side === 1 ? 'End first side' : 'End hold';
  return 'Stop';
}
function startHold(secs, sides, max) {
  run.hold = { phase: 'ready', side: 1, sides, secs, max: !!max, end: Date.now() + 3000, start: 0, work: [0, 0], beeped: {} };
  beep(660, 90);
  renderRun();
}
function renderHoldBits() {
  const H = run && run.hold;
  if (!H) return;
  const c = document.getElementById('holdClock');
  if (c) c.textContent = holdClockText(H);
  const l = document.getElementById('holdLbl');
  if (l) l.textContent = holdLabel(H);
  const v = document.getElementById('holdView');
  if (v) v.dataset.phase = H.phase;
  const b = $run.querySelector('[data-act="hold-stop"]');
  if (b) b.textContent = holdStopLabel(H);
}
function endSide() {
  const H = run.hold;
  if (H.sides === 2 && H.side === 1) { H.phase = 'switch'; H.end = Date.now() + 5000; beep(880, 160, 2); buzz(); renderHoldBits(); }
  else { beep(990, 220, 2); buzz(); finishHold(); }
}
function tickHold() {
  if (!run || !run.hold) return;
  const H = run.hold, now = Date.now();
  if (H.phase === 'work') {
    H.work[H.side - 1] = Math.min(H.secs, (now - H.start) / 1000);
    if (!H.max) {
      const sLeft = Math.ceil((H.end - now) / 1000), bk = 'w' + H.side + ':' + sLeft;
      if (sLeft > 0 && sLeft <= 3 && !H.beeped[bk]) { H.beeped[bk] = 1; beep(660, 80); }
    }
    if (now >= H.end) { H.work[H.side - 1] = H.secs; endSide(); return; }
  } else if (now >= H.end) {
    if (H.phase === 'switch') H.side = 2;
    H.phase = 'work'; H.start = now; H.end = now + H.secs * 1000;
    beep(990, 200);
  }
  renderHoldBits();
}
function finishHold() {
  const H = run.hold;
  if (!H) return;
  if (H.phase === 'ready') { run.hold = null; renderRun(); return; }
  const done = H.sides === 2 && H.side === 2 ? Math.min(H.work[0], H.work[1]) : H.work[0];
  logRunSet(Math.round(done));
}

/* ---------- Session clock, sounds, screen wake ---------- */
function tickSession() {
  if (!run) return;
  const el = document.getElementById('sessClock');
  if (!el) return;
  const s = session(run.w, run.d, false);
  if (!s || !s.startedAt) { el.textContent = ''; return; }
  const end = s.done && s.doneAt ? Date.parse(s.doneAt) : Date.now();
  el.textContent = fmtClock((end - s.startedAt) / 1000);
}
let actx = null;
function audioOn() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function beep(freq, ms, times) {
  if (state.sound === false || !actx) return;
  try {
    for (let k = 0; k < (times || 1); k++) {
      const t0 = actx.currentTime + k * (ms + 90) / 1000;
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
      o.start(t0); o.stop(t0 + ms / 1000 + 0.02);
    }
  } catch (e) { /* audio not available */ }
}
function buzz() { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* not supported */ } }
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && run) keepAwake(true); });

/* ---------- Warm-up item timers ---------- */
const mini = {};
function tickMini() {
  const now = Date.now();
  for (const k of Object.keys(mini)) {
    const m = mini[k];
    if (m.end && now >= m.end) { mini[k] = { doneAt: now }; beep(990, 220, 2); buzz(); }
    else if (m.doneAt && now - m.doneAt > 3000) delete mini[k];
  }
  document.querySelectorAll('[data-mini]').forEach(btn => {
    const m = mini[btn.dataset.mini];
    btn.classList.toggle('on', !!(m && m.end));
    btn.textContent = !m ? btn.dataset.label : m.end ? fmtSec(Math.ceil((m.end - now) / 1000)) : 'Done';
  });
}

/* ---------- Rest bar (log view) ---------- */
const $timer = document.getElementById('timer');
let bar = null;
function startTimer(r) {
  bar = { end: Date.now() + r.sec * 1000, beeped: {} };
  $timer.hidden = false;
  $timer.classList.remove('go');
  $timer.innerHTML = `<div class="wrap"><span class="lbl">${r.tag === 'Switch' ? 'Switch' : esc(r.tag) + ' rest'}</span><span class="clock" id="clock"></span>
    <button data-act="timer-add">+15 sec</button><button data-act="timer-stop">Done</button></div>`;
  tickTimer();
}
function tickTimer() {
  if (!bar) return;
  const left = Math.max(0, (bar.end - Date.now()) / 1000);
  const c = document.getElementById('clock');
  if (c) c.textContent = left > 0 ? fmtSec(Math.ceil(left)) : 'Go';
  const sLeft = Math.ceil(left);
  if (sLeft > 0 && sLeft <= 3 && !bar.beeped[sLeft]) { bar.beeped[sLeft] = 1; beep(660, 90); }
  if (left <= 0 && !bar.goAt) { bar.goAt = Date.now(); $timer.classList.add('go'); beep(990, 220, 2); buzz(); }
  if (bar.goAt && Date.now() - bar.goAt > 4000) stopTimer();
}
function stopTimer() { bar = null; $timer.hidden = true; $timer.innerHTML = ''; }

setInterval(() => { tickRest(); tickHold(); tickSession(); tickMini(); tickTimer(); }, 250);

/* =====================================================================
   Events
   ===================================================================== */
function runAction(act, t) {
  const { w, d } = run;
  const steps = buildSteps(w, d);
  const st = steps[run.idx];
  if (act === 'run-close') closeRun();
  else if (act === 'run-next' || act === 'run-skip') { run.idx = Math.min(run.idx + 1, steps.length - 1); renderRun(); }
  else if (act === 'run-back') {
    run.rest = null; run.hold = null;
    run.idx = Math.max(0, run.idx - 1);
    renderRun();
  }
  else if (act === 'run-log' && st && st.kind === 'set') logRunSet();
  else if (act === 'run-finish') {
    const s = session(w, d, true);
    s.done = true; s.doneAt = new Date().toISOString();
    if (s.startedAt) s.minutes = Math.round((Date.now() - s.startedAt) / 60000);
    save();
    toast(`Week ${w}, ${DAYS[d].title} finished${s.minutes ? ` in ${s.minutes} min` : ''}`);
    closeRun();
  }
  else if (act === 'rest-add' && run.rest) { run.rest.end += 15000; run.rest.total += 15000; run.rest.goAt = null; run.rest.beeped = {}; tickRest(); }
  else if (act === 'rest-sub' && run.rest) {
    run.rest.end = Math.max(Date.now() + 1000, run.rest.end - 15000);
    run.rest.total = Math.max(1000, run.rest.total - 15000);
    tickRest();
  }
  else if (act === 'rest-skip') endRest();
  else if (act === 'hold-start' && st && st.kind === 'set') {
    const ch = isChallengeSet(st.slot, w, d, st.i);
    if (ch && ch.mode === 'hold') startHold(ch.cap, perSide(st.ex, w) ? 2 : 1, true);
    else startHold(num(runField('r')) || repsOf(st.ex, w), perSide(st.ex, w) ? 2 : 1, false);
  }
  else if (act === 'hold-stop') {
    if (run.hold && run.hold.max && run.hold.phase === 'work') endSide(); else finishHold();
  }
  else if (act === 'splash-go' && st && st.kind === 'set') { run.splashed[st.slot.num] = true; renderRun(); }
  else if (act === 'sound') { state.sound = state.sound === false; save(); renderRun(); }
  else if (act === 'step') {
    const f = t.dataset.f, step = +t.dataset.by;
    const el = $run.querySelector(`[data-run="${f}"]`);
    if (!el) return;
    const cur = num(el.value) != null ? num(el.value) : (num(el.placeholder) || 0);
    el.value = String(Math.max(0, +(cur + step).toFixed(1)));
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  audioOn();
  const act = t.dataset.act;
  const inRun = run && $run.contains(t);
  const w = inRun ? run.w : state.week, d = inRun ? run.d : state.view;

  if (act === 'pr-close') { closePR(); return; }
  if (inRun && (act.startsWith('run-') || act.startsWith('rest-') || act.startsWith('hold-') || act === 'step' || act === 'sound' || act === 'splash-go')) { runAction(act, t); return; }
  if (act === 'goto-ch') {
    const card = document.getElementById('ex-' + t.dataset.slot);
    if (card) { card.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
    return;
  }

  if (act === 'variant') {
    const s = session(w, d, true);
    s.squat = t.dataset.v;
    save();
    if (inRun) renderRun(); else { renderDay(d); renderTabs(); }
    kickAnim();
    return;
  }
  if (act === 'mini') {
    const k = t.dataset.mini;
    if (mini[k] && mini[k].end) delete mini[k];
    else mini[k] = { end: Date.now() + (+t.dataset.sec) * 1000 };
    tickMini();
    return;
  }

  if (act === 'run') openRun();
  else if (act === 'prev' && w > 1) { state.week--; save(); render(); }
  else if (act === 'next' && w < WEEKS) { state.week++; save(); render(); }
  else if (act === 'week') { state.week = +t.dataset.w; save(); render(); }
  else if (act === 'view') { state.view = t.dataset.v; save(); render(); window.scrollTo(0, 0); }
  else if (act === 'tick') {
    const row = t.closest('.set');
    const ex = LIB[row.dataset.ex];
    const i = +row.dataset.i;
    const rows = rowsFor(w, d, ex, true);
    const r = rows[i];
    const slot = DAYS[d].slots.find(s => s.num === row.dataset.slot);
    let pr = false;
    if (r.d) r.d = false;
    else {
      const ch = isChallengeSet(slot, w, d, i);
      if (ch && ch.mode !== 'weight' && r.r === '') {
        toast('Type the reps or seconds you hit, then check it off.');
        const ri = row.querySelector('[data-f="r"]');
        if (ri) ri.focus();
        return;
      }
      completeSet(ex, w, d, i);
      const rest = restForSet(w, d, row.dataset.slot, i);
      if (rest && rest.sec > 0) startTimer(rest);
      save();
      pr = checkPR(w, d, ex, i, slot);
    }
    if (pr) { save(); renderDay(d); renderTabs(); return; }
    row.classList.toggle('is-done', r.d);
    t.setAttribute('aria-pressed', String(r.d));
    const wi = row.querySelector('[data-f="w"]'), ri = row.querySelector('[data-f="r"]');
    if (wi) wi.value = r.w;
    if (ri) ri.value = r.r;
    save(); refreshCard(row.dataset.slot); refreshCounts();
  }
  else if (act === 'finish') {
    const s = session(w, d, true);
    s.done = !s.done;
    s.doneAt = s.done ? new Date().toISOString() : null;
    save();
    toast(s.done ? `Week ${w}, ${DAYS[d].title} finished` : 'Session reopened');
    render();
  }
  else if (act === 'export') exportData();
  else if (act === 'import') document.getElementById('importFile').click();
  else if (act === 'reset') {
    if (confirm('Erase every logged set, test and note on this device? This cannot be undone.')) {
      state = blank(); save(); render(); toast('All logs erased');
    }
  }
  else if (act === 'timer-add' && bar) { bar.end += 15000; bar.goAt = null; bar.beeped = {}; tickTimer(); }
  else if (act === 'timer-stop') stopTimer();
});

document.addEventListener('input', e => {
  const t = e.target;
  const inRun = run && $run.contains(t);
  const w = inRun ? run.w : state.week, d = inRun ? run.d : state.view;
  if (t.dataset.f && !inRun) {
    const row = t.closest('.set');
    const ex = LIB[row.dataset.ex];
    const rows = rowsFor(w, d, ex, true);
    rows[+row.dataset.i][t.dataset.f] = t.value.trim();
    save(true);
  } else if (t.dataset.act === 'notes') {
    session(w, d, true).notes = t.value; save(true);
  } else if (t.dataset.act === 'test') {
    state.tests[w] = state.tests[w] || {};
    state.tests[w][t.dataset.t] = t.value.trim(); save(true);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  const inRun = run && $run.contains(t);
  const w = inRun ? run.w : state.week, d = inRun ? run.d : state.view;
  if (t.dataset.act === 'warm') {
    const s = session(w, d, true);
    s.warm[+t.dataset.i] = t.checked;
    t.closest('label').classList.toggle('done', t.checked);
    const h = t.closest('.sec').querySelector('[data-warm-title]');
    if (h) h.textContent = WARMUP.every((_, i) => s.warm[i]) ? 'Warm-up done' : 'Warm-up';
    save();
  } else if (t.dataset.act === 'balance') {
    session(w, d, true).balance = +t.value; save();
  } else if (t.dataset.act === 'test') {
    writeNow();
    const ev = computePRs().at[`t${w}:${t.dataset.t}`];
    if (ev) celebrate(ev, ev.test.label + ' test', true);
  }
});

document.addEventListener('toggle', e => { if (e.target.tagName === 'DETAILS' && e.target.open) kickAnim(); }, true);

/* ---------- Backup ---------- */
function exportData() {
  writeNow();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gym-plan-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exported');
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || s.v !== 1 || typeof s.sessions !== 'object') throw new Error('bad file');
      if (!confirm('Replace the logs on this device with this backup?')) return;
      state = Object.assign(blank(), s); save(); render(); toast('Backup imported');
    } catch (err) {
      toast("That file isn't a Gym Plan backup.");
    }
    e.target.value = '';
  };
  reader.readAsText(f);
});

/* ---------- Toast ---------- */
const $toast = document.getElementById('toast');
let toastT = null;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => $toast.classList.remove('show'), 2600);
}

render();
})();
</script>
</body>
</html>
